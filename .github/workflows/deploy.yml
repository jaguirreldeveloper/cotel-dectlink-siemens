name: Deploy to Laravel Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9.x'

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API types
        run: pnpm --filter types generate

      - name: Build frontend
        run: pnpm --filter frontend build
        env:
          VITE_API_TARGET: ${{ secrets.VITE_API_TARGET }}
          # VITE_ADMIN_TOKEN eliminado: los secretos no se empaquetan en el bundle.

      - name: Build scripts
        run: pnpm --filter scripts build

      - name: Copy frontend to backend
        run: pnpm --filter scripts run copy:dist

      - name: Verify build
        run: |
          if [ ! -f backend/public/index.html ]; then
            echo "ERROR: backend/public/index.html not found"
            exit 1
          fi
          echo "✓ Build verified"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, mbstring, dom, curl, bcmath, gd, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-deploy-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-deploy-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Laravel Cloud CLI
        run: |
          curl -sS https://laravel-cloud-cli.test/get | bash
          echo "✓ Laravel Cloud CLI installed"

      - name: Deploy to Laravel Cloud
        if: github.ref == 'refs/heads/main' && (env.LARAVEL_CLOUD_APP != '' && env.LARAVEL_CLOUD_TOKEN != '')
        working-directory: backend
        run: |
          cloud deploy --app="${LARAVEL_CLOUD_APP}" --token="${LARAVEL_CLOUD_TOKEN}" --branch=main --force --no-interaction
          echo "✅ Deployed to Laravel Cloud"
        env:
          LARAVEL_CLOUD_APP: ${{ secrets.LARAVEL_CLOUD_APP }}
          LARAVEL_CLOUD_TOKEN: ${{ secrets.LARAVEL_CLOUD_TOKEN }}

      - name: Build validation complete
        if: github.ref != 'refs/heads/main' || (env.LARAVEL_CLOUD_APP == '' || env.LARAVEL_CLOUD_TOKEN == '')
        run: echo "✓ Build validated - Ready for Laravel Cloud deployment"