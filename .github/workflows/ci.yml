name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (PHPStan + Pest + Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Clave de aplicación para tests
        run: cp .env.example .env && php artisan key:generate --force
      - name: PHPStan
        run: composer run stan
      - name: Pest (suite completa, sqlite :memory:)
        run: composer test
      - name: Pint (formato)
        run: vendor/bin/pint --test
