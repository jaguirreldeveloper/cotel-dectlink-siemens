name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9.x'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck packages/types
        run: pnpm --filter types typecheck

      - name: Typecheck frontend
        run: pnpm --filter frontend typecheck

      - name: Typecheck scripts
        run: pnpm --filter scripts typecheck

      - name: Lint frontend
        run: pnpm --filter frontend lint

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API types
        run: pnpm --filter types generate

      - name: Build frontend
        run: pnpm --filter frontend build
        env:
          VITE_API_TARGET: ${{ secrets.VITE_API_TARGET }}

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  build-scripts:
    name: Build Scripts
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API types
        run: pnpm --filter types generate

      - name: Build scripts
        run: pnpm --filter scripts build

      - name: Upload scripts build
        uses: actions/upload-artifact@v4
        with:
          name: scripts-dist
          path: scripts/dist/
          retention-days: 7

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API types
        run: pnpm --filter types generate

      - name: Run frontend tests
        run: pnpm --filter frontend test

  test-scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API types
        run: pnpm --filter types generate

      - name: Run scripts tests
        run: pnpm --filter scripts test

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, dom, curl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run backend tests (Pest) with SQLite
        working-directory: backend
        run: php artisan test --compact

  test-backend-postgresql:
    name: Test Backend with PostgreSQL
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cotel
          POSTGRES_PASSWORD: cotel123
          POSTGRES_DB: cotel_dectlink
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: cotel_dectlink
      DB_USERNAME: cotel
      DB_PASSWORD: cotel123
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, mbstring, dom, curl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-pgsql-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-pgsql-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare backend environment for PostgreSQL
        working-directory: backend
        run: |
          cat > .env <<ENV
          APP_NAME="COTEL DECTlink"
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8010
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=${DB_CONNECTION}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          ENV
          php artisan key:generate --force --no-interaction

      - name: Run migrations
        working-directory: backend
        run: php artisan migrate:fresh --force --no-interaction

      - name: Run backend tests (Pest) with PostgreSQL
        working-directory: backend
        run: php artisan test --compact

  db-check:
    name: DB Schema Check
    runs-on: ubuntu-latest
    needs: build-scripts
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SQL_HOST: ${{ secrets.SQL_HOST }}
      SQL_DB_NAME: ${{ secrets.SQL_DB_NAME }}
      SQL_ADMIN_USER: ${{ secrets.SQL_ADMIN_USER }}
      SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download scripts build
        uses: actions/download-artifact@v4
        with:
          name: scripts-dist
          path: scripts/dist/

      # En main, un secret ausente debe FALLAR de forma visible (no saltarse en silencio).
      - name: Requerir DATABASE_URL (falla en main si el secret falta)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: el secret DATABASE_URL no está configurado."
            exit 1
          fi

      # En PRs (p. ej. de forks sin secrets) se salta sin romper el build.
      - name: Run db:check
        if: env.DATABASE_URL != ''
        run: pnpm --filter scripts db:check

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-backend-postgresql]
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/backend/database/ci.sqlite
      ADMIN_TOKEN: ci-admin-token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, dom, curl
          coverage: none

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare backend environment
        working-directory: backend
        run: |
          cat > .env <<ENV
          APP_NAME="COTEL DECTlink"
          APP_ENV=local
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8010
          APP_LOCALE=es
          APP_FALLBACK_LOCALE=en
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=${DB_CONNECTION}
          DB_DATABASE=${DB_DATABASE}
          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          ADMIN_TOKEN=${ADMIN_TOKEN}
          ENV
          php artisan key:generate --force --no-interaction

      - name: Create SQLite database
        working-directory: backend
        run: touch database/ci.sqlite

      - name: Migrate and seed e2e data
        working-directory: backend
        run: |
          php artisan migrate:fresh --force --no-interaction
          php artisan db:seed --class=E2eSeeder --force --no-interaction

      - name: Install Playwright Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          PW_CHANNEL: chromium
        run: pnpm --filter frontend test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

  e2e-postgresql:
    name: E2E Tests with PostgreSQL
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-backend-postgresql]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cotel
          POSTGRES_PASSWORD: cotel123
          POSTGRES_DB: cotel_dectlink
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: cotel_dectlink
      DB_USERNAME: cotel
      DB_PASSWORD: cotel123
      ADMIN_TOKEN: ci-admin-token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, mbstring, dom, curl
          coverage: none

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare backend environment for PostgreSQL
        working-directory: backend
        run: |
          cat > .env <<ENV
          APP_NAME="COTEL DECTlink"
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8010
          APP_LOCALE=es
          APP_FALLBACK_LOCALE=en
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=${DB_CONNECTION}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          ADMIN_TOKEN=${ADMIN_TOKEN}
          ENV
          php artisan key:generate --force --no-interaction

      - name: Run migrations and seed
        working-directory: backend
        run: |
          php artisan migrate:fresh --force --no-interaction
          php artisan db:seed --class=E2eSeeder --force --no-interaction

      - name: Install Playwright Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Run E2E tests with PostgreSQL
        env:
          PW_CHANNEL: chromium
        run: pnpm --filter frontend test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-pgsql
          path: frontend/test-results/
          retention-days: 7

  deploy-check:
    name: Deploy Verification
    runs-on: ubuntu-latest
    needs: [build-frontend, build-scripts, db-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Download scripts build
        uses: actions/download-artifact@v4
        with:
          name: scripts-dist
          path: scripts/dist/

      - name: Copy frontend to backend
        run: pnpm --filter scripts run copy:dist

      - name: Verify backend/public has frontend
        run: |
          if [ ! -f backend/public/index.html ]; then
            echo "ERROR: backend/public/index.html not found"
            exit 1
          fi
          echo "✓ Frontend copied to backend/public"

      - name: Smoke test (if SMOKE_URL provided)
        if: env.SMOKE_URL != ''
        run: pnpm --filter scripts smoke
        env:
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
          EXPECTED_LINES: ${{ secrets.EXPECTED_LINES }}
          # La API exige x-admin-token; si no se define, el smoke recibe 401.
          SMOKE_ADMIN_TOKEN: ${{ secrets.SMOKE_ADMIN_TOKEN }}

  deploy-laravel-cloud:
    name: Deploy to Laravel Cloud
    runs-on: ubuntu-latest
    needs: deploy-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      LARAVEL_CLOUD_APP: ${{ secrets.LARAVEL_CLOUD_APP }}
      LARAVEL_CLOUD_TOKEN: ${{ secrets.LARAVEL_CLOUD_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, mbstring, dom, curl, bcmath, gd, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-laravel-cloud-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-laravel-cloud-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Copy frontend to backend/public
        run: |
          mkdir -p backend/public
          cp -r frontend/dist/* backend/public/
          echo "✓ Frontend copied to backend/public"

      - name: Setup Laravel Cloud CLI
        run: |
          curl -sS https://laravel-cloud-cli.test/get | bash
          echo "✓ Laravel Cloud CLI installed"

      - name: Deploy to Laravel Cloud
        if: env.LARAVEL_CLOUD_APP != '' && env.LARAVEL_CLOUD_TOKEN != ''
        run: |
          cd backend
          cloud deploy --app="${LARAVEL_CLOUD_APP}" --token="${LARAVEL_CLOUD_TOKEN}" --branch=main --force
          echo "✓ Deployed to Laravel Cloud"
        env:
          CLOUD_APP: ${{ secrets.LARAVEL_CLOUD_APP }}
          CLOUD_TOKEN: ${{ secrets.LARAVEL_CLOUD_TOKEN }}